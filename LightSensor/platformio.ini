; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = example_nano

; Default environment for the project
[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
build_flags = -std=c++1z

[env:uno]
board = uno

[env:nano]
board = nanoatmega328

[env:example]
build_src_filter =
    +<../examples/LightSensor*>
    +<../*>
lib_deps =
    https://github.com/DanN91/platform-io-libraries#ObserverPattern

[env:example_uno]
extends = env:uno, env:example

[env:example_nano]
extends = env:nano, env:example
